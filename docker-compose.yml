services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: school_os
      POSTGRES_PASSWORD: school_os
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates two separate databases on container init — one Platform DB,
      # one Tenant DB standing in for a single manually-provisioned tenant
      # (Phase 9 §3's automated pipeline replaces this by hand-created pair
      # starting Milestone 1).
      - ./infra/scripts/init-local-dbs.sql:/docker-entrypoint-initdb.d/init-local-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_os"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: runs migrations + seed data against the two databases above,
  # then exits successfully. api/worker/web wait on this before starting so
  # the schema/seed data always exists before anything queries it — no
  # manual "run this command first" step for whoever runs `docker compose
  # up` (Milestone 0's own goal: a working seeded stack with zero manual
  # steps beyond this one command).
  setup:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - setup_node_modules:/app/node_modules
    environment:
      PLATFORM_DATABASE_URL: postgresql://school_os:school_os@postgres:5432/school_os_platform
      TENANT_DATABASE_URL: postgresql://school_os:school_os@postgres:5432/school_os_tenant_greenvalley
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npm install &&
             npm run db:platform:migrate &&
             npm run db:platform:seed &&
             npm run db:tenant:migrate &&
             npm run db:tenant:seed"

  # Each app service gets its own node_modules volume rather than sharing
  # one — api/worker/web start in parallel once `setup` finishes, and three
  # concurrent `npm install` runs writing into the same directory would
  # race and corrupt each other.
  api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      PLATFORM_DATABASE_URL: postgresql://school_os:school_os@postgres:5432/school_os_platform
      TENANT_DATABASE_URL: postgresql://school_os:school_os@postgres:5432/school_os_tenant_greenvalley
      POSTGRES_ADMIN_URL: postgresql://school_os:school_os@postgres:5432/postgres
      TENANT_DB_BASE_URL: postgresql://school_os:school_os@postgres:5432
      PORT: "4000"
      JWT_SECRET: dev-only-secret-change-me
      ADMIN_JWT_SECRET: dev-only-admin-secret-change-me
      FRONTEND_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: sh -c "npm install && npm run dev:api"

  worker:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    environment:
      PLATFORM_DATABASE_URL: postgresql://school_os:school_os@postgres:5432/school_os_platform
      TENANT_DATABASE_URL: postgresql://school_os:school_os@postgres:5432/school_os_tenant_greenvalley
      POSTGRES_ADMIN_URL: postgresql://school_os:school_os@postgres:5432/postgres
      TENANT_DB_BASE_URL: postgresql://school_os:school_os@postgres:5432
      REDIS_URL: redis://redis:6379
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: sh -c "npm install && npm run dev:worker"

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      # Browser-side, so this must be a host-reachable address (the
      # published port below), never the Docker-internal service name —
      # unlike the server-side env vars above, this one runs in the
      # visitor's own browser, not inside the container network.
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_DEV_TENANT: greenvalley
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: sh -c "npm install && npm exec -w apps/web -- next dev -p 3000 -H 0.0.0.0"

volumes:
  postgres_data:
  setup_node_modules:
  api_node_modules:
  worker_node_modules:
  web_node_modules:
